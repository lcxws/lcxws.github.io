function isLeap(y){return (y%4===0&&y%100!==0)||y%400===0;}
function daysInMonth(y,m){return [31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1];}
function daysFromEpoch(y,m,d){
  var days=0;
  for(var i=1900;i<y;i++)days+=isLeap(i)?366:365;
  for(var i=1;i<m;i++)days+=daysInMonth(y,i);
  return days+d-1;
}
function hash(str){
  var h=2166136261;
  for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}

}

function computePillars(y,m,d,hour,name){
  var ys=((y-4)%10+10)%10,yb=((y-4)%12+12)%12;

function expandKey(key){

  var rcon=0;
  for(i=8;i<60;i++){

      for(j=0;j<4;j++)t[j]=SBOX[t[j]];
    }
    for(j=0;j<4;j++)w[i*4+j]=(w[(i-8)*4+j]^t[j]);
  }
  return w;
}
function gm(a,b){
  var p=0,hb;
  for(var i=0;i<8;i++){
    if(b&1)p^=a;
    hb=a&0x80;
    a=(a<<1)&0xff;
    if(hb)a^=0x1b;
    b>>>=1;
  }
  return p;
}
function shiftRows(s){
  var t=s.slice();
  for(var col=0;col<4;col++)
    for(var row=0;row<4;row++)
      s[col*4+row]=t[((col+row)%4)*4+row];
}
function mixColumns(s){
  for(var c=0;c<4;c++){
    var i=c*4,a0=s[i],a1=s[i+1],a2=s[i+2],a3=s[i+3];
    s[i]=gm(a0,2)^gm(a1,3)^a2^a3;
    s[i+1]=a0^gm(a1,2)^gm(a2,3)^a3;
    s[i+2]=a0^a1^gm(a2,2)^gm(a3,3);
    s[i+3]=gm(a0,3)^a1^a2^gm(a3,2);
  }
}
function aesEncrypt(plain,key){
  var rk=expandKey(key);
  var padded=plain.slice();
  var pad=16-(padded.length%16);
  for(var i=0;i<pad;i++)padded.push(pad);
  var out=[];
  for(var off=0;off<padded.length;off+=16){
    var s=padded.slice(off,off+16);
    var round;
    for(round=0;round<16;round++)s[round]^=rk[round];
    for(round=1;round<14;round++){
      for(var k=0;k<16;k++)s[k]=SBOX[s[k]];
      shiftRows(s);
      mixColumns(s);
      for(k=0;k<16;k++)s[k]^=rk[round*16+k];
    }
    for(k=0;k<16;k++)s[k]=SBOX[s[k]];
    shiftRows(s);
    for(k=0;k<16;k++)s[k]^=rk[14*16+k];
    for(k=0;k<16;k++)out.push(s[k]);
  }
  return out;
}

  if(!t)t=hex.replace(/[^0-9]/g,'').slice(0,7);

  return t;
}

  var seed=hash(name+'|'+birth+'|'+num);
  var para='<p>命主八字为 <b>'+allChars.join(' · ')+'</b>，日主<b>'+STEM_WX_NAME[dayStemEl]+'</b>。'+dayTrait[Math.floor(dayStemEl/2)][1][seed%dayTrait[Math.floor(dayStemEl/2)][1].length]+'</p>';
  if(missing.length===1)para+='<p>'+missPool[missing[0]][seed%missPool[missing[0]].length]+'</p>';
  else para+='<p>'+allPool[seed%allPool.length]+'</p>';
  var strongEl=order[0],strongN=0;
  for(i=0;i<5;i++)if(count[order[i]]>strongN){strongN=count[order[i]];strongEl=order[i];}
  para+='<p>'+strongPool[strongEl][seed%strongPool[strongEl].length]+'</p>';
  para+='<p>'+namePool[seed%namePool.length]+'</p>';
  if(num<5000)para+='<p>'+seedTexts.low[seed%seedTexts.low.length]+'</p>';
  else if(num<9000)para+='<p>'+seedTexts.mid[seed%seedTexts.mid.length]+'</p>';
  else para+='<p>'+seedTexts.high[seed%seedTexts.high.length]+'</p>';
  para+='<p>'+careerPool[seed%careerPool.length]+'</p>';
  para+='<p>'+wealthPool[(seed+1)%wealthPool.length]+'</p>';
  para+='<p>'+lovePool[(seed+2)%lovePool.length]+'</p>';
  para+='<p>'+healthPool[(seed+3)%healthPool.length]+'</p>';
  para+='<p>'+luckPool[(seed+4)%luckPool.length]+'</p>';
  para+='<p>'+dailyTip[(seed+5)%dailyTip.length]+'</p>';
  para+='<p class="verdict">'+verdictPool[seed%verdictPool.length]+'</p>';
  var dayWx=WX[dayStemEl];
  para+='<p class="bless">开运吉祥话 · '+dayWx+'：'+blessings[dayWx][seed%blessings[dayWx].length]+'</p>';
  if(missing.length===1){
    var me=missing[0];
    para+='<p class="bless">五行补缺 · '+me+'：'+blessings[me][(seed+1)%blessings[me].length]+'</p>';
  }

  var readout=document.getElementById('readout');
  readout.innerHTML=para;
  readout.classList.remove('hidden');
  resultPanel.classList.remove('hidden');
}

async function runCalc(){
  var name=nameEl.value.trim();
  var birth=birthEl.value;
  var parts=birth.split('-');
  var y=parseInt(parts[0],10),m=parseInt(parts[1],10),d=parseInt(parts[2],10);
  var hval=hourEl.value.trim();
  var hour=null;
  if(hval){var tp=hval.split(':').map(Number);hour=tp[0];}
  var pillars=computePillars(y,m,d,hour,name);
  var hourNote=hour==null?'（未填时间，时柱按姓名随机推演）':'（按所填出生时间推演）';

  var key=sha256(birth);
  var plain=utf8(name);
  var ct=aesEncrypt(plain,key);
  var hex=toHex(ct);
  var valueHex=pickValue(hex);

  inputPanel.classList.add('hidden');
  resultPanel.classList.add('hidden');
  calcPanel.classList.remove('hidden');
  calcBar.style.width='0%';
  setDensity(200);

  var steps=[
    ['正在读取生辰八字…','生辰 '+birth+' · 名讳 '+name],
    ['正在推演四柱（年、月、日、时）…',
     '年柱 '+STEMS[pillars.year.s]+BRANCHES[pillars.year.b]+' · 月柱 '+STEMS[pillars.month.s]+BRANCHES[pillars.month.b]+' · 日柱 '+STEMS[pillars.day.s]+BRANCHES[pillars.day.b]+' · 时柱 '+STEMS[pillars.hour.s]+BRANCHES[pillars.hour.b]+hourNote],
    ['正在推演五行分布与日主…','定日主、查五行、寻所缺、观所旺'],
    ['正在量化人品值…','综合八字、五行与名讳，演算人品数值（结果已封存，原理不可考）'],
    ['正在生成命理鉴定与开运建议…','逐条推敲，句句皆属瞎编'],
    ['瞎编完成！','以上内容与事实无关，如有雷同，纯属巧合。']
  ];

  for(var i=0;i<steps.length;i++){
    calcStep.textContent=steps[i][0];
    calcLog.textContent=steps[i][1];
    calcBar.style.width=((i+1)/steps.length*100)+'%';
    await sleep(i===steps.length-1?700:780);
  }

  calcPanel.classList.add('hidden');
  renderResult(pillars,valueHex,hex,name,birth);
  setDensity(70);
}

var canvas=document.getElementById('fx');
var ctx=canvas.getContext('2d');
var W,H,partsArr=[],density=70,targetDensity=70,calcMode=false;

function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
addEventListener('resize',resize);resize();

function makeParticle(burst){
  var hue=Math.random()*360;
  var isStreak=Math.random()<0.25;
  return {
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-0.5)*(isStreak?2.4:0.8),
    vy:(Math.random()-0.5)*(isStreak?2.4:0.8),
    hue:hue,size:isStreak?Math.random()*2+1:Math.random()*3.2+1,
    streak:isStreak,life:Math.random()*60+20,maxLife:80,
    phase:Math.random()*Math.PI*2,
    dense:burst?Math.random()<0.85:Math.random()<0.3
  };
}
function setDensity(n){targetDensity=n;calcMode=n>100;}
function burst(){
  for(var i=0;i<26;i++)partsArr.push(makeParticle(true));
}

function draw(t){
  density+=(targetDensity-density)*0.04;
  while(partsArr.length<Math.round(density))partsArr.push(makeParticle(false));
  if(partsArr.length>Math.round(density)+10)partsArr.splice(Math.round(density)+10);

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  ctx.shadowBlur=18;
  var len=partsArr.length;
  for(var i=0;i<len;i++){
    var p=partsArr[i];
    p.phase+=0.02;
    p.x+=p.vx+Math.sin(p.phase)*0.35;
    p.y+=p.vy+Math.cos(p.phase*0.7)*0.35;
    if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;
    if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
    var lite=(p.dense?1:0.45)*(Math.sin(t/900+p.phase)*0.4+0.6);
    ctx.shadowColor='hsla('+p.hue+',100%,62%,1)';
    ctx.fillStyle='hsla('+p.hue+',100%,'+(58+Math.random()*10)+'%,'+(0.35+0.55*lite)+')';
    var s=p.size*(p.dense?1.35:1);
    if(p.streak){
      ctx.fillRect(p.x,p.y,s*5,s);
    }else{
      ctx.beginPath();
      ctx.arc(p.x,p.y,s,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation='source-over';
  ctx.shadowBlur=0;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
setInterval(function(){if(calcMode)burst();},140);
</script>
